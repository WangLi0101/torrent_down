[package]
name = "torrnet-player"
version = "0.1.0"
description = "磁力链接下载与边下边播播放器"
edition = "2021"
rust-version = "1.85"

[lib]
name = "torrnet_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["http-api", "rust-tls", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
